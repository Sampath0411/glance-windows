name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Install pinned Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "Inno Setup checksum mismatch: $hash" }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }

      - name: Run source regression suites
        shell: pwsh
        run: |
          .venv\Scripts\python.exe test_desktop.py
          .venv\Scripts\python.exe test_cli.py
          .venv\Scripts\python.exe test_liveness.py
          .venv\Scripts\python.exe test_grant.py
          .venv\Scripts\python.exe -m unittest test_packaging -v
          .venv\Scripts\python.exe -m unittest tests.test_fetch_models -v
          .venv\Scripts\python.exe -m unittest tests.test_packaged_icon -v
          .venv\Scripts\python.exe -m unittest tests.test_collect_notices -v
          .venv\Scripts\python.exe -m unittest tests.test_backend_helper tests.test_admin_helper_policy tests.test_pending_grant tests.test_agent_paths -v

      - name: Build standalone app, agent, provider and protected installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          .\packaging\build_windows.ps1 -BuildInstaller

      - name: Upload standalone app and installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64-${{ github.run_number }}
          path: |
            build/package/launch_glance.dist/
            dist/GlanceSetup.exe
          if-no-files-found: error
          retention-days: 7
